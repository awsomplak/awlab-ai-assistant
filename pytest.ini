[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = src
tmp_path_retention_policy = failed
tmp_path_retention_count = 3
filterwarnings =
    # Benign: the mcp SDK's FastMCP settings model defines a `lifespan` field
    # with a forward reference that pydantic-settings flags at import time.
    # Not our code; all tests pass. Ignore only this exact warning.
    ignore:Field 'lifespan' has an incomplete definition.*