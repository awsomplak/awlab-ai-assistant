[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "awlab-mcp-server"
version = "1.1.0"
description = "Deterministic MCP server for plan management, cross-session memory, and AI-assisted development workflows"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.28",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
hybrid = [
    "fastembed>=0.5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pyinstaller>=6.0",
]

[project.scripts]
awlab-mcp = "mcp_server.server:main"
awlab-plan = "mcp_server.server_plan:main"
awlab-memory = "mcp_server.server_memory:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mcp_server*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]