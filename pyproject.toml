[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "awlab-mcp-server"
version = "3.0.1"
description = "Deterministic MCP server for plan management, cross-session memory, and AI-assisted development workflows"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.28",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "agent-recall>=0.4.0",
    "pyinstaller>=6.0",
    "fastembed>=0.5.0",
    "graphifyy>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "vulture>=2.0",
]

[project.scripts]
awlab-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mcp_server*"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".vulture_whitelist.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"